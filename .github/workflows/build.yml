name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize source filename
        run: |
          # Makefile 固定引用 Tweak.xm；上传的源文件可能叫 tweak.xm / 其它名字，
          # 甚至是 .m / .mm 后缀。这里统一改名为 Tweak.xm（Logos 对纯 ObjC 文件也兼容）。
          echo "--- before ---"
          ls -la
          shopt -s nullglob
          target=""
          for f in Tweak.xm tweak.xm *.xm *.x *.mm *.m; do
            if [ -f "$f" ]; then target="$f"; break; fi
          done
          if [ -n "$target" ] && [ "$target" != "Tweak.xm" ]; then
            mv -- "$target" Tweak.xm
            echo "renamed '$target' -> 'Tweak.xm'"
          fi
          echo "--- after ---"
          ls -la Tweak.xm

      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls -1 "$THEOS/sdks"

      - name: Install ldid / dpkg
        run: |
          brew install ldid dpkg || brew install ldid || true
          which ldid || true
          which dpkg-deb || true

      - name: Ensure objc/message.h import
        run: |
          # 源码用了 objc_msgSend 却没 import <objc/message.h> 时，
          # 会报 "use of undeclared identifier 'objc_msgSend'"。此处自动补上（幂等）。
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          if "objc_msgSend" in s and "#import <objc/message.h>" not in s:
              lines = s.split("\n")
              idx = 0
              for i, ln in enumerate(lines):
                  if ln.lstrip().startswith("#import"):
                      idx = i + 1
              lines.insert(idx, "#import <objc/message.h>")
              p.write_text("\n".join(lines))
              print("inserted objc/message.h import")
          else:
              print("objc/message.h import present or not needed")
          PY

      - name: Fix void* to function pointer casts
        run: |
          # 形如 "orig_X = (void *)method_getImplementation(...)" 或
          # "orig_X = (void *)SafeSwizzleInstanceMethod(...)" 在 ObjC++ 下是错误：
          # void* 不能直接赋给函数指针。此处通用改写为目标变量自身的类型（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'([A-Za-z_]\w*)\s*=\s*\(void \*\)(\w+\()',
                           r'\1 = (__typeof__(\1))\2', s)
          if n:
              p.write_text(new)
          print("rewrote", n)
          PY

      - name: Fix __bridge void* to typed C pointer casts
        run: |
          # ARC 下 "uint8_t *base = (__bridge void *)obj;" 在 ObjC++ 里是错误
          # （void* 不能隐式转成具体指针），需要显式补上目标类型转换（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(
              r'(?m)^([ \t]*)([A-Za-z_]\w*(?:[ \t]*\*)+)[ \t]*([A-Za-z_]\w*)[ \t]*=[ \t]*\(__bridge void \*\)',
              r'\1\2\3 = (\2)(__bridge void *)', s)
          if n:
              p.write_text(new)
          print("fixed", n, "bridge-void cast(s)")
          PY

      - name: Ensure dlfcn.h import
        run: |
          # 源码用了 dlsym(RTLD_DEFAULT, ...) 却没 import <dlfcn.h> 时，
          # 会报 "use of undeclared identifier 'RTLD_DEFAULT'"。此处自动补上（幂等）。
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          if ("RTLD_DEFAULT" in s or "dlsym(" in s) and "#import <dlfcn.h>" not in s:
              lines = s.split("\n")
              idx = 0
              for i, ln in enumerate(lines):
                  if ln.lstrip().startswith("#import"):
                      idx = i + 1
              lines.insert(idx, "#import <dlfcn.h>")
              p.write_text("\n".join(lines))
              print("inserted dlfcn.h import")
          else:
              print("dlfcn.h import present or not needed")
          PY

      - name: Fix ARC strong/unsafe_unretained pointer casts
        run: |
          # ARC 下 "*(id __strong *)(base + off)"、"*(id __unsafe_unretained *)(uint8_t *...)"
          # 以及声明式 "id __unsafe_unretained *p = (id __unsafe_unretained *)(...)" 都会报
          # "cast of a non-Objective-C pointer type 'uint8_t *' to '... id *' is disallowed
          #  with ARC"。在转换前插入中间 (void *) 转换即可合法（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(
              r'\(\s*([A-Za-z_]\w*(?:\s*\*)?)\s*__(strong|unsafe_unretained)\s*\*\)\s*(?!\(void \*\))\((?!(?:void|id|NSString|NSObject|Class)\b)',
              r'(\1 __\2 *)(void *)(', s)
          if n:
              p.write_text(new)
          print("wrapped", n, "ARC pointer cast(s)")
          PY

      - name: Fix malformed [self == ...] message expressions
        run: |
          # 形如 "[self == [NSBundle mainBundle]]" 是非法消息语法，会报 "expected identifier"。
          # 改为等价的括号表达式 "(self == [NSBundle mainBundle])"（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'\[\s*(self\s*==\s*\[[^\[\]]*\])\s*\]', r'(\1)', s)
          if n:
              p.write_text(new)
          print("fixed", n, "malformed [self == ...] expression(s)")
          PY

      - name: Fix malformed @catch(identifier) without type
        run: |
          # 形如 "@catch(e){}" 的写法缺少异常类型，会报 "unknown type name 'e'"。
          # ObjC 要求 @catch 带类型（如 NSException *e），此处自动补上（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'@catch\(\s*([A-Za-z_]\w*)\s*\)', r'@catch(NSException *\1)', s)
          if n:
              p.write_text(new)
          print("fixed", n, "malformed @catch(...) expression(s)")
          PY

      - name: Ensure ReadSwiftString helper definition
        run: |
          # 若源码调用了 ReadSwiftString(...) 却没有定义，会报 "use of undeclared identifier"。
          # 此处自动注入一份通用实现（幂等，仅在缺失时插入）。
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          if "ReadSwiftString(" in s and "static NSString *ReadSwiftString(" not in s:
              helper = '''static NSString *ReadSwiftString(id obj, ptrdiff_t offset) {
              if (!obj) return nil;
              @try {
                  uint8_t *base = (uint8_t *)(__bridge void *)obj;
                  uint64_t word0 = *(uint64_t *)(base + offset);
                  uint64_t word1 = *(uint64_t *)(base + offset + 8);
                  if (word0 == 0 && word1 == 0) return nil;
                  uint8_t topByte = (uint8_t)(word1 >> 56);
                  if ((topByte & 0xE0) == 0xE0) {
                      NSUInteger len = topByte & 0x0F;
                      if (len > 0 && len <= 15) {
                          char buf[16] = {0};
                          memcpy(buf, base + offset, len);
                          return [[NSString alloc] initWithBytes:buf length:len encoding:NSUTF8StringEncoding];
                      }
                      return @"";
                  }
                  typedef id (*SwiftStringToNSStringFunc)(uint64_t, uint64_t);
                  static SwiftStringToNSStringFunc bridgeFunc = NULL;
                  static dispatch_once_t onceToken;
                  dispatch_once(&onceToken, ^{
                      void *sym = dlsym(RTLD_DEFAULT, "$sSS10FoundationE19_bridgeToObjectiveCSo8NSStringCyF");
                      if (!sym) sym = dlsym(RTLD_DEFAULT, "_$sSS10FoundationE19_bridgeToObjectiveCSo8NSStringCyF");
                      bridgeFunc = (SwiftStringToNSStringFunc)sym;
                  });
                  if (bridgeFunc && (word1 != 0)) {
                      id nsStr = bridgeFunc(word0, word1);
                      if ([nsStr isKindOfClass:[NSString class]]) return (NSString *)nsStr;
                  }
              } @catch (NSException *e) {}
              return nil;
              }
              '''
              lines = s.split("\n")
              idx = 0
              for i, ln in enumerate(lines):
                  if ln.lstrip().startswith("#import"):
                      idx = i + 1
              lines.insert(idx, helper)
              p.write_text("\n".join(lines))
              print("inserted ReadSwiftString helper")
          else:
              print("ReadSwiftString helper present or not needed")
          PY

      - name: Ensure NSString altName declaration
        run: |
          # altName: 的实现位于文件后部，而调用点可能在其之前，
          # 会报 "no known class method for selector 'altName:'"。
          # 若源码缺少前置声明则自动补上（幂等，仅在缺失时插入）。
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          if "altName:" in s and "@interface NSString (HOExt)" not in s:
              decl = ("\n// 前置声明：altName: 实现在文件后部，避免调用点在定义之前。\n"
                      "@interface NSString (HOExt)\n"
                      "+ (NSString *)altName:(NSString *)uid;\n"
                      "@end\n")
              lines = s.split("\n")
              idx = 0
              for i, ln in enumerate(lines):
                  if ln.lstrip().startswith("#import"):
                      idx = i + 1
              lines.insert(idx, decl)
              p.write_text("\n".join(lines))
              print("inserted altName declaration")
          else:
              print("altName declaration present or not needed")
          PY

      - name: Fix stray '*' in method declarations
        run: |
          # 源码中形如 "- * (void)foo" 的写法是非法语法（多了一个 *），
          # 会导致编译错误。此处规范化为 "- (void)foo"（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'(?m)^([ \t]*[-+][ \t]*)\*[ \t]*(?=\()', r'\1', s)
          if n:
              p.write_text(new)
          print("fixed stray star in", n, "method declaration(s)")
          PY

      - name: Fix address-of property expressions
        run: |
          # 形如 "&obj.prop" 的写法在 ObjC 中非法（编译器报
          # "address of property expression requested"）。此处自动改为
          # 先赋给临时变量再取地址（幂等，仅匹配独立的 obj.prop）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          src = p.read_text()
          pat = re.compile(r'&([A-Za-z_]\w*)\.([A-Za-z_]\w*)(?=[\s\];,)])')
          count = 0
          def fix_line(line):
              global count
              ms = list(pat.finditer(line))
              if not ms:
                  return line
              parts, prefix, last = [], "", 0
              for m in ms:
                  count += 1
                  name = "__argtmp_%d" % count
                  prefix += "__auto_type %s = %s.%s; " % (name, m.group(1), m.group(2))
                  parts.append(line[last:m.start()])
                  parts.append("&" + name)
                  last = m.end()
              parts.append(line[last:])
              return prefix + "".join(parts)
          new = "\n".join(fix_line(l) for l in src.split("\n"))
          if count:
              p.write_text(new)
          print("fixed", count, "address-of property expression(s)")
          PY

      - name: Fix dot-syntax mutableCopy on id
        run: |
          # msg.mutableCopy（msg 为 id）在点语法下被当成属性访问而报错，
          # 规范化为 [msg mutableCopy]（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'(?<![\w.])([A-Za-z_]\w*)\.mutableCopy\b(?!\s*:)', r'[\1 mutableCopy]', s)
          if n:
              p.write_text(new)
          print("fixed", n, "dot-syntax mutableCopy")
          PY

      - name: Move class interfaces before first use
        run: |
          # 顶层 @interface X : Super ... @end 若出现在其首次使用之后，
          # 会报 "unknown type name 'X'"。自动把该声明块移动到（首次使用所在的）
          # 顶层块之前（幂等）。注意不能插到方法体内部，否则 @interface 非法。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          lines = p.read_text().split("\n")

          def find_blocks():
              blocks, i = [], 0
              while i < len(lines):
                  m = re.match(r'^@interface\s+([A-Za-z_]\w*)\s*:\s*\S', lines[i])
                  if m:
                      j = i
                      while j < len(lines) and lines[j].strip() != '@end':
                          j += 1
                      blocks.append((m.group(1), i, j))
                      i = j + 1
                  else:
                      i += 1
              return blocks

          def enclosing_start(k):
              for t in range(k, -1, -1):
                  if re.match(r'^(@implementation|@interface|%hook)\b', lines[t]):
                      return t
              return 0

          moved = []
          for _ in range(20):
              did = False
              for name, s, e in find_blocks():
                  first_use = None
                  for k in range(0, s):
                      if re.search(r'\b%s\b' % re.escape(name), lines[k]):
                          first_use = k
                          break
                  if first_use is not None:
                      target = enclosing_start(first_use)
                      block = lines[s:e+1]
                      del lines[s:e+1]
                      lines[target:target] = block
                      moved.append(name)
                      did = True
                      break
              if not did:
                  break
          if moved:
              p.write_text("\n".join(lines))
          print("moved interfaces:", moved)
          PY

      - name: Rename properties starting with 'new'
        run: |
          # 形如 @property ... *newXxx; 的属性名以 new 开头，被编译器当成
          # 返回 "owned" 对象，报 "property follows Cocoa naming convention"。
          # 此处统一把 newXxx 改名为 pendingXxx（幂等，全量按词边界替换）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          names = set()
          for m in re.finditer(r'@property\s*\([^)]*\)[^;]*?\b(new[A-Z]\w*)\b\s*;', s):
              names.add(m.group(1))
          count = 0
          for n in names:
              newname = "pending" + n[3:]
              s, c = re.subn(r'\b%s\b' % re.escape(n), newname, s)
              count += c
          if count:
              p.write_text(s)
          print("renamed", count, "occurrence(s) of", sorted(names))
          PY

      - name: Cast self in %hook of undeclared classes
        run: |
          # %hook 一个未在文件中声明 @interface 的类时，self 的类型只是前置声明，
          # 对它发消息会报 "receiver type 'X' ... is a forward declaration"。
          # 把这些 [self ...] / [self.xxx] 转成 [(id)self ...] / [((id)self).xxx]（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          lines = p.read_text().split("\n")
          declared = set(re.findall(r'^@interface\s+([A-Za-z_]\w*)', "\n".join(lines), re.M))
          count = 0
          i = 0
          while i < len(lines):
              m = re.match(r'^%hook\s+([A-Za-z_]\w*)', lines[i])
              if m:
                  cls = m.group(1)
                  j = i
                  while j < len(lines) and not re.match(r'^%end', lines[j]):
                      j += 1
                  if cls not in declared:
                      for k in range(i, j+1):
                          # 点语法：self.foo -> [[(id)self foo]（(id) 转换后不能再走点语法，
                          # 否则报 "property 'foo' not found on object of type 'id'"）。
                          def _dot(line):
                              pat = re.compile(r'\[\s*(?:\(\(id\)self\)|self)\.(\w+)\s*([^\]]*)\]')
                              for _ in range(5):
                                  line, n = pat.subn(
                                      lambda m: '[[(id)self %s]%s]' % (
                                          m.group(1),
                                          (' ' + m.group(2).strip()) if m.group(2).strip() else ''
                                      ), line)
                                  if not n:
                                      break
                              return line
                          lines[k] = _dot(lines[k])
                          # 消息语法：self -> (id)self
                          lines[k], n2 = re.subn(r'\[self(?=[ \]])', '[(id)self', lines[k])
                          count += n2
                  i = j + 1
              else:
                  i += 1
          if count:
              p.write_text("\n".join(lines))
          print("casted self in", count, "place(s)")
          PY

      - name: Build dylib
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Package deb
        run: make package FINALPACKAGE=1

      - name: Inspect build output
        if: always()
        run: |
          find .theos/obj -name '*.dylib' -exec file {} \; || true
          ls -l packages/ || true

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oo-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oo-deb
          path: packages/*.deb
          if-no-files-found: ignore
