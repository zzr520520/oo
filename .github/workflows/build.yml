name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize source filename
        run: |
          # Makefile 固定引用 Tweak.xm；若上传的源文件名大小写不同
          # （例如 tweak.xm），Theos 生成的编译规则会找不到源文件。
          # 这里统一改名为 Tweak.xm（保留仓库中唯一的 .xm 文件）。
          echo "--- before ---"
          ls -la
          shopt -s nullglob
          for f in *.xm; do
            if [ "$f" != "Tweak.xm" ]; then
              mv -- "$f" Tweak.xm
              echo "renamed '$f' -> 'Tweak.xm'"
            fi
          done
          echo "--- after ---"
          ls -la *.xm

      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls -1 "$THEOS/sdks"

      - name: Install ldid / dpkg
        run: |
          brew install ldid dpkg || brew install ldid || true
          which ldid || true
          which dpkg-deb || true

      - name: Fix void* to function pointer casts
        run: |
          # Tweak.xm 中的 orig_X = (void *)method_getImplementation(...) 在 ObjC++ 下是错误：
          # void* 不能直接赋给函数指针。此处精确改写为目标变量自身的类型。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'([A-Za-z_]\w*)\s*=\s*\(void \*\)method_getImplementation\(',
                           r'\1 = (__typeof__(\1))method_getImplementation(', s)
          if n:
              p.write_text(new)
          print("rewrote", n)
          PY

      - name: Ensure NSString altName declaration
        run: |
          # altName: 的实现位于文件后部，而调用点可能在其之前，
          # 会报 "no known class method for selector 'altName:'"。
          # 若源码缺少前置声明则自动补上（幂等，仅在缺失时插入）。
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          if "altName:" in s and "@interface NSString (HOExt)" not in s:
              decl = ("\n// 前置声明：altName: 实现在文件后部，避免调用点在定义之前。\n"
                      "@interface NSString (HOExt)\n"
                      "+ (NSString *)altName:(NSString *)uid;\n"
                      "@end\n")
              lines = s.split("\n")
              idx = 0
              for i, ln in enumerate(lines):
                  if ln.lstrip().startswith("#import"):
                      idx = i + 1
              lines.insert(idx, decl)
              p.write_text("\n".join(lines))
              print("inserted altName declaration")
          else:
              print("altName declaration present or not needed")
          PY

      - name: Fix stray '*' in method declarations
        run: |
          # 源码中形如 "- * (void)foo" 的写法是非法语法（多了一个 *），
          # 会导致编译错误。此处规范化为 "- (void)foo"（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'(?m)^([ \t]*[-+][ \t]*)\*[ \t]*(?=\()', r'\1', s)
          if n:
              p.write_text(new)
          print("fixed stray star in", n, "method declaration(s)")
          PY

      - name: Fix address-of property expressions
        run: |
          # 形如 "&obj.prop" 的写法在 ObjC 中非法（编译器报
          # "address of property expression requested"）。此处自动改为
          # 先赋给临时变量再取地址（幂等，仅匹配独立的 obj.prop）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          src = p.read_text()
          pat = re.compile(r'&([A-Za-z_]\w*)\.([A-Za-z_]\w*)(?=[\s\];,)])')
          count = 0
          def fix_line(line):
              global count
              ms = list(pat.finditer(line))
              if not ms:
                  return line
              parts, prefix, last = [], "", 0
              for m in ms:
                  count += 1
                  name = "__argtmp_%d" % count
                  prefix += "__auto_type %s = %s.%s; " % (name, m.group(1), m.group(2))
                  parts.append(line[last:m.start()])
                  parts.append("&" + name)
                  last = m.end()
              parts.append(line[last:])
              return prefix + "".join(parts)
          new = "\n".join(fix_line(l) for l in src.split("\n"))
          if count:
              p.write_text(new)
          print("fixed", count, "address-of property expression(s)")
          PY

      - name: Fix dot-syntax mutableCopy on id
        run: |
          # msg.mutableCopy（msg 为 id）在点语法下被当成属性访问而报错，
          # 规范化为 [msg mutableCopy]（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'(?<![\w.])([A-Za-z_]\w*)\.mutableCopy\b(?!\s*:)', r'[\1 mutableCopy]', s)
          if n:
              p.write_text(new)
          print("fixed", n, "dot-syntax mutableCopy")
          PY

      - name: Move class interfaces before first use
        run: |
          # 顶层 @interface X : Super ... @end 若出现在其首次使用之后，
          # 会报 "unknown type name 'X'"。自动把该声明块移动到（首次使用所在的）
          # 顶层块之前（幂等）。注意不能插到方法体内部，否则 @interface 非法。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          lines = p.read_text().split("\n")

          def find_blocks():
              blocks, i = [], 0
              while i < len(lines):
                  m = re.match(r'^@interface\s+([A-Za-z_]\w*)\s*:\s*\S', lines[i])
                  if m:
                      j = i
                      while j < len(lines) and lines[j].strip() != '@end':
                          j += 1
                      blocks.append((m.group(1), i, j))
                      i = j + 1
                  else:
                      i += 1
              return blocks

          def enclosing_start(k):
              for t in range(k, -1, -1):
                  if re.match(r'^(@implementation|@interface|%hook)\b', lines[t]):
                      return t
              return 0

          moved = []
          for _ in range(20):
              did = False
              for name, s, e in find_blocks():
                  first_use = None
                  for k in range(0, s):
                      if re.search(r'\b%s\b' % re.escape(name), lines[k]):
                          first_use = k
                          break
                  if first_use is not None:
                      target = enclosing_start(first_use)
                      block = lines[s:e+1]
                      del lines[s:e+1]
                      lines[target:target] = block
                      moved.append(name)
                      did = True
                      break
              if not did:
                  break
          if moved:
              p.write_text("\n".join(lines))
          print("moved interfaces:", moved)
          PY

      - name: Build dylib
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Package deb
        run: make package FINALPACKAGE=1

      - name: Inspect build output
        if: always()
        run: |
          find .theos/obj -name '*.dylib' -exec file {} \; || true
          ls -l packages/ || true

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oo-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oo-deb
          path: packages/*.deb
          if-no-files-found: ignore
